# =============================================================================
# SHE V3 — Flutter mobile app pubspec.yaml
# =============================================================================
# V3-MOBILE-APP §2. Flutter 3.22+ / Dart 3.4+.
# =============================================================================

name: she_mobile
description: Smart Home Ethiopia V3 — Flutter mobile app
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- State management ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Routing ----
  go_router: ^14.2.0

  # ---- HTTP + WebSocket ----
  dio: ^5.5.0
  web_socket_channel: ^3.0.0

  # ---- Storage ----
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # ---- BLE + mDNS ----
  flutter_blue_plus: ^1.32.7
  multicast_dns: ^0.3.2+7

  # ---- Charts ----
  fl_chart: ^0.68.0

  # ---- Push notifications ----
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.0

  # ---- Payments (Phase 3) ----
  # flutter_web_auth_2: ^3.1.2

  # ---- i18n ----
  intl: ^0.20.2

  # ---- UI ----
  cupertino_icons: ^1.0.8

  # ---- Crash reporting (Phase 5) ----
  # firebase_core: ^3.3.0
  # firebase_crashlytics: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  # ---- Localization (V3-I18N) ----
  generate: true
