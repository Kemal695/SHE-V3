# =============================================================================
# SHE V3 — Flutter mobile app pubspec.yaml
# =============================================================================
# V3-MOBILE-APP §2. Flutter 3.22+ / Dart 3.4+.
# =============================================================================

name: she_mobile
description: Smart Home Ethiopia V3 — Flutter mobile app
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- State management ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Routing ----
  go_router: ^14.2.0

  # ---- HTTP + WebSocket ----
  dio: ^5.5.0
  web_socket_channel: ^3.0.0

  # ---- Storage ----
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # ---- BLE + mDNS ----
  flutter_blue_plus: ^1.32.7
  multicast_dns: ^0.3.2+7

  # ---- Charts ----
  # Bumped 0.68.0 -> 1.2.0: 0.68.0 does not compile on Dart 3.13 / Flutter 3.47.5
  # (errors in fl_chart's own source: 'TextDirection'/'Offset' "isn't a type",
  # switch-exhaustiveness). 1.x keeps the same charting API this app uses.
  fl_chart: ^1.2.0

  # ---- Push notifications ----
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.0

  # ---- Payments (Phase 3) ----
  # flutter_web_auth_2: ^3.1.2

  # ---- i18n ----
  intl: ^0.20.2

  # ---- UI ----
  cupertino_icons: ^1.0.8

  # ---- Social sign-in (Google / Apple) ----
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # ---- Custom images (scene / group covers + icons) ----
  # System photo picker: no storage permission needed on Android 13+, and it
  # keeps the app out of the gallery permission conversation entirely.
  image_picker: ^1.1.2

  # ---- Location automations (foreground geofence) ----
  # Used only while the app is open: the position stream stops when the app is
  # backgrounded, so no background-location permission is requested.
  geolocator: ^13.0.1

  # ---- Voice control (phone-side) ----
  # On-device wake word / speech recognition. Deliberately NOT the firmware
  # Picovoice path (Phase 4C, R16-only): this runs on the phone, so it works
  # with any SKU including the R24, needs no extra hardware and no mic on the
  # board, and reuses the same REST API the UI already calls.
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # ---- BLE provisioning (Espressif wifi_prov_mgr, Security 1 + PoP) ----
  # Vendored from flutter_esp_ble_prov 0.1.7 + modernized Android build
  # (AGP 8 / namespace) under plugins/. Upstream android/build.gradle
  # (AGP 7.4, no namespace) no longer builds with Flutter 3.44.
  flutter_esp_ble_prov:
    path: plugins/flutter_esp_ble_prov

  # ---- Crash reporting (Phase 5) ----
  # firebase_core: ^3.3.0
  # firebase_crashlytics: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  # ---- Localization (V3-I18N) ----
  generate: true

  # ---- Prototype image assets (V3-UI-REDESIGN) ----
  # Ported from SHE-V3-prototype-download/public/img/. Used by the Splash and
  # Onboarding screens; the app previously shipped no image assets at all.
  assets:
    - assets/img/
    # Official SHE logo (transparent PNG) — used by splash, login and register.
    - assets/branding/
