# =============================================================================
# SHE V3 — CI/CD pipeline
# =============================================================================
# Phase 0 exit criterion (V3-ROADMAP §2):
#   "CI/CD pipeline builds + deploys backend automatically on merge"
#
# Trigger: push to main → build → test → build Docker image → push to GHCR → deploy staging
# Trigger: PR to main → build → test (no deploy)
#
# References:
#   V3-ROADMAP.md §2 (Phase 0 deliverables)
#   V3-ARCHITECTURE.md §2 (CI/CD = GitHub Actions)
#   V3-OPS-RUNBOOK.md §2.1 (routine deploy procedure)
#   V3-DEVELOPER-SETUP.md §2.1 (repo = github.com:she-v3/she-v3.git)
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:        # manual trigger for prod promotions

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'        # P1-25 — Java 21 LTS
  MAVEN_VERSION: '3.9.9'
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/she-backend

jobs:

  # ===========================================================================
  # 1. BUILD + TEST
  # ===========================================================================
  build-test:
    name: Build + Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history for git-commit-id plugin

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Generate test JWT Ed25519 keypair
        # Required for unit tests in JwtServiceTest
        run: |
          mkdir -p backend/src/test/resources/keys
          openssl genpkey -algorithm ed25519 -out backend/src/test/resources/keys/jwt_ed25519.pem
          openssl pkey -in backend/src/test/resources/keys/jwt_ed25519.pem \
            -pubout -out backend/src/test/resources/keys/jwt_ed25519.pub

      - name: Build + Test (Maven)
        working-directory: backend
        run: mvn -B -ntp clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          retention-days: 14

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: she-backend-jar
          path: backend/target/she-backend.jar
          retention-days: 7

  # ===========================================================================
  # 2. DOCKER BUILD + PUSH (only on main)
  # ===========================================================================
  docker-build-push:
    name: Docker Build + Push
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ env.DOCKER_IMAGE }}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_latest=${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_OUTPUT

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: she-backend-jar
          path: backend/target/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_latest }}
          # Label with OCI standard metadata (visible in ghcr.io UI)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short_sha }}
            org.opencontainers.image.title=SHE V3 Backend
            org.opencontainers.image.description=Smart Home Ethiopia V3 backend

      - name: Print image reference
        run: |
          echo "Docker image pushed: ${{ steps.meta.outputs.image_tag }}"
          echo "Also tagged as: ${{ steps.meta.outputs.image_latest }}"

  # ===========================================================================
  # 3. DEPLOY TO STAGING (auto on merge to main)
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.she.et/actuator/health
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deploy vars
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: SSH deploy to staging VPS
        # V3-OPS-RUNBOOK §2.1 — routine deploy procedure:
        #   ssh jump.she.et → ssh app-1 → docker compose pull backend-1 →
        #   docker compose up -d backend-1 --no-deps → wait for health →
        #   then app-2 (sequentially — never simultaneously)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_APP_1_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/she-v3
            git fetch --all
            git reset --hard origin/main
            cd infra

            # Pull the new image
            echo "$GHCR_PAT" | docker login ghcr.io -u she-v3-bot --password-stdin
            docker compose pull backend-1

            # Deploy to backend-1 (rolling — backend-2 stays up during this)
            docker compose up -d backend-1 --no-deps

            # Wait for backend-1 health
            echo "Waiting for backend-1 health..."
            for i in {1..30}; do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "backend-1 is UP"
                break
              fi
              sleep 5
            done

            # Deploy to backend-2
            docker compose pull backend-2
            docker compose up -d backend-2 --no-deps

            # Wait for backend-2 health
            for i in {1..30}; do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "backend-2 is UP — deploy complete"
                exit 0
              fi
              sleep 5
            done

            echo "ERROR: backend-2 did not become healthy"
            exit 1
          env:
            GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Verify staging health endpoint
        # Phase 0 exit criterion: /actuator/health returns UP
        run: |
          sleep 10   # give nginx a moment to refresh upstream
          for i in {1..12}; do
            STATUS=$(curl -sf https://staging.she.et/actuator/health | jq -r '.status' || echo "FAIL")
            if [ "$STATUS" = "UP" ]; then
              echo "✓ Staging /actuator/health returns UP"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "✗ Staging health check FAILED after 12 attempts"
          exit 1

  # ===========================================================================
  # 4. NOTIFY (Slack/PagerDuty — optional, can be added later)
  # ===========================================================================
  notify:
    name: Notify
    needs: [build-test, docker-build-push, deploy-staging]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summary
        run: |
          echo "## CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build+Test | ${{ needs.build-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build+Push | ${{ needs.docker-build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
