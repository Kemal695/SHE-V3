# =============================================================================
# PostgreSQL 16 configuration for SHE V3
# Canonical reference: V3-CONFIGURATION.md §2.3, V3-DATABASE-DESIGN §1
# TimescaleDB tuning: V3-ARCHITECTURE §5.2
# =============================================================================

# ---------- Connection / memory ----------
listen_addresses = '*'
max_connections = 200
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB

# ---------- WAL / replication ----------
wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
archive_mode = on
# archive_command is set in production via V3-OPS-RUNBOOK §7 — locally we disable
archive_command = ''
max_wal_senders = 5

# ---------- Query planner ----------
random_page_cost = 1.1              # NVMe/SSD
effective_io_concurrency = 200
default_statistics_target = 200

# ---------- Timeouts ----------
statement_timeout = 30s             # hard cap; long queries use @Timed + retry
idle_in_transaction_session_timeout = 60s
lock_timeout = 5s

# ---------- Logging ----------
log_min_duration_statement = 200ms  # log queries slower than 200ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %u@%d %h '
log_lock_waits = on

# ---------- TimescaleDB (V3-ARCHITECTURE §5.2) ----------
timescaledb.max_background_workers = 8
timescaledb.telemetry_level = off

# ---------- Shared preload libraries ----------
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# ---------- RLS hardening ----------
row_security = on                   # refuse queries that would bypass RLS

# ---------- Authentication ----------
password_encryption = scram-sha-256
