%% SHE-V3 MQTT ACL — EMQX file authorization source (V3-SECURITY-MODEL §4.3)
%% First-match-wins; unmatched topics denied via authorization.no_match = deny.
%% Device topics: she/{tenant}/{home}/{room}/{mac}/{direction} (+ optional /sub).
%% Backend topic (shared subscription): $share/she-backend/she/.../...
%%
%% NOTE: MQTT topic filters support ONLY `+` and `#` wildcards. There is no regex
%% alternation — a filter such as `she/+/+/+/+/(telemetry|status)` is parsed as a
%% literal 8-level topic, matches no real device topic, and is therefore DENIED by
%% the `{deny, all}` catch-all below. Every direction must be listed explicitly,
%% in BOTH the plain form (used when EMQX strips the `$share/<group>/` prefix
%% before ACL evaluation) and the `$share/<group>/` form (used when it does not).

%% ── Backend / any subscriber: plain filters ──────────────────────────────────
{allow, all, subscribe, ["she/+/+/+/+/telemetry"]}.
{allow, all, subscribe, ["she/+/+/+/+/status"]}.
{allow, all, subscribe, ["she/+/+/+/+/params/local"]}.
{allow, all, subscribe, ["she/+/+/+/+/energy"]}.
{allow, all, subscribe, ["she/+/+/+/+/ota/status"]}.
{allow, all, subscribe, ["she/+/+/+/+/ota/progress"]}.
{allow, all, subscribe, ["she/+/+/+/+/command"]}.
{allow, all, subscribe, ["she/+/+/+/+/params/remote"]}.
{allow, all, subscribe, ["she/+/+/+/+/ota/url"]}.
{allow, all, subscribe, ["she/+/+/+/+/config"]}.
%% Device-local schedule state (diagnostic). Both forms are required: EMQX matches the
%% PLAIN topic for a shared subscription, so the `$share/...` rule alone is not enough
%% (the config entry above is the precedent — it carries both).
{allow, all, subscribe, ["she/+/+/+/+/schedules"]}.

%% ── Backend shared subscription ($share/she-backend) ─────────────────────────
{allow, all, subscribe, ["$share/she-backend/she/+/+/+/+/telemetry"]}.
{allow, all, subscribe, ["$share/she-backend/she/+/+/+/+/status"]}.
{allow, all, subscribe, ["$share/she-backend/she/+/+/+/+/params/local"]}.
{allow, all, subscribe, ["$share/she-backend/she/+/+/+/+/energy"]}.
{allow, all, subscribe, ["$share/she-backend/she/+/+/+/+/ota/status"]}.
{allow, all, subscribe, ["$share/she-backend/she/+/+/+/+/ota/progress"]}.
{allow, all, subscribe, ["$share/she-backend/she/+/+/+/+/config"]}.
{allow, all, subscribe, ["$share/she-backend/she/+/+/+/+/schedules"]}.

%% ── Device -> cloud publish ──────────────────────────────────────────────────
{allow, all, publish, ["she/+/+/+/+/command"]}.
{allow, all, publish, ["she/+/+/+/+/params/remote"]}.
{allow, all, publish, ["she/+/+/+/+/ota/url"]}.
{allow, all, publish, ["she/+/+/+/+/config"]}.
{allow, all, publish, ["she/+/+/+/+/params/local"]}.
{allow, all, publish, ["she/+/+/+/+/telemetry"]}.
{allow, all, publish, ["she/+/+/+/+/status"]}.
{allow, all, publish, ["she/+/+/+/+/energy"]}.
{allow, all, publish, ["she/+/+/+/+/ota/status"]}.
{allow, all, publish, ["she/+/+/+/+/ota/progress"]}.
%% Device-local schedule state (diagnostic). Without this the device's schedule_add
%% result is unobservable from the server — the API returns 200 whether the device
%% stored the entry or silently rejected it (e.g. list full).
{allow, all, publish, ["she/+/+/+/+/schedules"]}.

{deny, all}.
