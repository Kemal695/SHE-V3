# =============================================================================
# nginx config — CRL distribution point
# Serves https://she.et/ca/{intermediate_id}/crl.pem
# Canonical reference: V3-SECURITY-MODEL §3.3, V3-CONFIGURATION §3.5
# Refresh: every 6 hours (P1-22)
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name she.et crl.she.et _;

    # CRL files are written to /usr/share/nginx/html/ca/{intermediate_id}/crl.pem
    # by infra/ca/refresh-crl.sh
    root /usr/share/nginx/html;

    # CRL endpoint — public, no auth (per V3-OPS-RUNBOOK §6.3, fetched by EMQX
    # over HTTP to avoid cert-chicken-egg problem during TLS handshake).
    # ^~ gives this prefix location priority over the regex location below
    # (otherwise .pem files under /ca/ would be blocked by the deny rule).
    location ^~ /ca/ {
        alias /usr/share/nginx/html/ca/;
        autoindex off;
        types { }
        default_type application/pkix-crl;
        add_header Cache-Control "public, max-age=21600" always;  # 6 hours
        add_header X-Content-Type-Options "nosniff" always;
        # Only allow GET/HEAD
        limit_except GET HEAD { deny all; }
        # Block path traversal
        if ($request_uri ~* "\.\.") { return 404; }
    }

    # Health probe
    location = /healthz {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # Everything else — 404 (including ca_bundle.pem, root_ca.crt, etc.
    # which live at the volume root but must NOT be served publicly)
    location / {
        return 404;
    }

    # Explicit deny for sensitive files (defense-in-depth — the location / above
    # already returns 404, but this makes intent clear)
    location ~* \.(key|pem|crt)$ {
        # Allow .pem ONLY under /ca/ (CRL files are .pem)
        # This regex location matches .pem at the root, which we want to deny.
        # The /ca/ location above handles valid CRL .pem files.
        return 404;
    }
}
