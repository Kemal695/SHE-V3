# =============================================================================
# SHE V3 — Production Nginx config
# =============================================================================
# V3-ARCHITECTURE §3, V3-OPS-RUNBOOK §1, V3-SECURITY-MODEL §10.5
# Deploy on edge-1:443. TLS 1.3 only. 4 routes. Security headers.
# Upstream health check removes unhealthy instance within 10s.
# =============================================================================

# ---- Upstream: Spring Boot (round-robin, health check) ----
upstream spring_boot {
    server app-1:8080 max_fails=3 fail_timeout=10s;
    server app-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ---- Upstream: Next.js admin web ----
upstream admin_web {
    server admin-web:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ---- Rate limiting zones ----
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=100r/m;

# ---- HTTP → HTTPS redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name she.et api.she.et admin.she.et app.she.et;
    return 301 https://$host$request_uri;
}

# ---- HTTPS main server ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name she.et api.she.et;

    # ---- TLS 1.3 only (V3-ARCHITECTURE §509) ----
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;

    # ---- Cloudflare Authenticated Origin Pulls ----
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # ---- Security headers (OWASP A05) ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://she.et; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # ---- Request size limit ----
    client_max_body_size 50m;

    # ---- API routes → Spring Boot ----
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://spring_boot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---- Login rate limiting (5 req/min per IP) ----
    location ~ ^/api/v3/auth/(login|register)$ {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://spring_boot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Admin API rate limiting (100 req/min) ----
    location /api/admin/ {
        limit_req zone=admin_limit burst=20 nodelay;
        proxy_pass http://spring_boot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- WebSocket → Spring Boot (sticky by Sec-WebSocket-Protocol) ----
    location /ws/ {
        proxy_pass http://spring_boot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Actuator health (no rate limit — for probes) ----
    location /actuator/health {
        proxy_pass http://spring_boot;
        access_log off;
    }

    # ---- Payment webhook (no rate limit — Chapa IP whitelisted at Cloudflare) ----
    location /api/v3/payments/webhook {
        proxy_pass http://spring_boot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Static assets (cache 30d) ----
    location /static/ {
        root /var/www/she;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ---- Admin web server (admin.she.et) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.she.et;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        limit_req zone=admin_limit burst=20 nodelay;
        proxy_pass http://admin_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API calls to Spring Boot
    location /api/ {
        limit_req zone=admin_limit burst=20 nodelay;
        proxy_pass http://spring_boot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ---- Prometheus metrics exporter ----
server {
    listen 9113;
    location /metrics {
        stub_status on;
        access_log off;
    }
}
