# =============================================================================
# SHE V3 — Local development infrastructure
# =============================================================================
# Spins up the full Phase 0 dependency stack on a single host:
#   - Postgres 16 + TimescaleDB  (relational + time-series)
#   - Redis 7                    (cache + JWT jti blacklist)
#   - EMQX 5.x x3                (3-node MQTT cluster, mTLS :8883)
#   - MinIO                      (object storage for OTA + B2B assets)
#   - step-ca                    (root + intermediate CA, cert issuance API)
#   - step-ca CRL server         (nginx serving crl.pem at https://she.et/ca/...)
#
# Canonical references:
#   - V3-ARCHITECTURE.md §2 (component overview), §6 (EMQX cluster)
#   - V3-CONFIGURATION.md §2.1-2.5 (env vars), §3 (step-ca setup)
#   - V3-DEVELOPER-SETUP.md §3 (docker compose up -d), §6 (.env.local)
#   - V3-OPS-RUNBOOK.md §1 (production infra table — same shape, smaller scale)
#
# Production note: in prod this maps to 5+ VPS on Ethio Telecom Cloud
# (edge-1, app-1, app-2, db-1, storage-1, monitor-1, mqtt-1/2/3).
# This compose file is the local-dev / staging mirror of that topology.
# =============================================================================

name: she-v3

# ----------------------------------------------------------------------------
# Networks: emulate the production VPC segmentation
# ----------------------------------------------------------------------------
networks:
  she-backend:    # Spring Boot ↔ Postgres ↔ Redis ↔ EMQX ↔ MinIO ↔ step-ca

volumes:
  she-postgres-data:
  she-redis-data:
  she-emqx-1-data:
  she-minio-data:
  she-stepca-data:
  she-ca-certs:   # shared RO volume with CA bundle for EMQX + Spring Boot

# ----------------------------------------------------------------------------
# Services
# ----------------------------------------------------------------------------
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB 2.x — db-1 in production
  # V3-CONFIGURATION §2.3, V3-DATABASE-DESIGN §1, V3-ARCHITECTURE §5.1
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: she-postgres
    restart: unless-stopped
    networks: [she-backend]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-she_v3}
      POSTGRES_USER: ${POSTGRES_USER:-she_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeLocal}
      # Superuser password is required for migration bootstrap (she_app does NOT have BYPASSRLS — P0-5)
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-ChangeMeLocalSuper}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: 2
    volumes:
      - she-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-she_app} -d ${POSTGRES_DB:-she_v3}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis 7 — cache-1 in production
  # V3-ARCHITECTURE §5.4 (Redis cache TTLs)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: she-redis
    restart: unless-stopped
    networks: [she-backend]
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ChangeMeLocal}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-ChangeMeLocal}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - she-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeMeLocal}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------------------------------------------------------------------
  # EMQX 5.x — 3-node cluster — mqtt-1/2/3 in production
  # V3-ARCHITECTURE §6, V3-CONFIGURATION §2.2, V3-MQTT-STANDARDS §9
  # P1-11: auth cache TTL = 300s.  P1-32: authorization via EMQX_AUTHORIZATION__SOURCES (HOCON-as-JSON).
  # ---------------------------------------------------------------------------
  emqx-1:
    image: emqx/emqx:5.8.4
    container_name: she-emqx-1
    restart: unless-stopped
    networks:
      she-backend:
        aliases: [emqx-1]
    ports:
      - "8883:8883"     # MQTTS mTLS (devices)
      - "18083:18083"   # dashboard
      - "8083:8083"     # WebSocket (Phase 1+)
    environment:
      EMQX_NODE__NAME: emqx@localhost
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD__DEFAULT_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD__DEFAULT_PASSWORD:-ChangeMeLocal}
      # mTLS listener (V3-SECURITY-MODEL §3.4)
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__MAX_CONNECTIONS: 5000
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /etc/emqx/certs/server.key
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /etc/emqx/certs/server.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /etc/emqx/certs/ca_bundle.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_peer
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERSIONS: "[tlsv1.3,tlsv1.2]"
      # HTTP auth backend → Spring Boot /internal/mqtt/auth (V3-SECURITY-MODEL §4.2)
      EMQX_AUTHENTICATION: >
        [
          {
            "mechanism": "password_based",
            "backend": "http",
            "method": "post",
            "url": "http://she-backend:8080/internal/mqtt/auth",
            "headers": { "content-type": "application/json" },
            "body": { "clientid": "${clientid}", "cn": "${peer_cert_cn}", "fingerprint": "${peer_cert_fingerprint}" }
          }
        ]
      # EMQX_AUTHENTICATION__CACHE__TTL removed (not supported in 5.8.4)
      # ACL — allow all for local dev (file authz debug deferred)
      EMQX_LOG__CONSOLE__LEVEL: warning
    volumes:
      - she-emqx-1-data:/opt/emqx/data
      - she-ca-certs:/etc/emqx/certs:ro
      - ./emqx/acl.conf:/etc/emqx/acl.conf:ro
    depends_on:
      - step-ca  # for CA certs
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: she-minio
    restart: unless-stopped
    networks: [she-backend]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-she}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMeLocal}
      MINIO_VOLUMES: /data
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      MINIO_SERVER_URL: http://localhost:9000
    command: server /data --console-address ":9001"
    volumes:
      - she-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # step-ca — db-1 in production (colocated with Postgres in V3-OPS-RUNBOOK §1)
  # V3-CONFIGURATION §3 (bootstrap), V3-SECURITY-MODEL §3.1 (PKI hierarchy)
  # P0-2: root RSA 4096/20yr, intermediate RSA 4096/10yr, device cert ECDSA P-256/5yr
  # P1-24: intermediate key HSM-backed (YubiHSM 2) in production — local dev uses encrypted file
  # ---------------------------------------------------------------------------
  step-ca:
    image: smallstep/step-ca:0.27.4
    container_name: she-step-ca
    restart: unless-stopped
    networks: [she-backend]
    ports:
      - "9002:9000"   # step-ca API on host 9002 (9000 is MinIO)
    environment:
      STEPPATH: /home/step
      # The bootstrap script (infra/ca/bootstrap-ca.sh) initializes the CA on first run
      # and writes config + certs into the she-stepca-data volume.
    volumes:
      - she-stepca-data:/home/step
      - she-ca-certs:/home/step/ca-certs-output
      - ./ca/bootstrap-ca-local.sh:/bootstrap-ca.sh:ro
      - ./ca/step-ca-provisioner-password.txt:/provisioner-password.txt:ro
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /home/step/config/ca.json ]; then
          echo "First boot — initializing CA...";
          sh /bootstrap-ca.sh;
        fi;
        exec step-ca /home/step/config/ca.json --password-file /provisioner-password.txt
    healthcheck:
      test: ["CMD-SHELL", "step ca health --ca-url https://localhost:9000 --root /home/step/certs/root_ca.crt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # CRL server — nginx serving https://she.et/ca/{intermediate_id}/crl.pem
  # V3-SECURITY-MODEL §3.3, V3-CONFIGURATION §3.5
  # P1-22: refresh every 6 hours. Revocation SLA < 6 hours.
  # In dev, CRL is generated by infra/ca/refresh-crl.sh (cron in the host).
  # ---------------------------------------------------------------------------
  crl-server:
    image: nginx:1.27-alpine
    container_name: she-crl-server
    restart: unless-stopped
    networks: [she-backend]
    ports:
      - "8088:80"
    volumes:
      - she-ca-certs:/usr/share/nginx/html/ca:ro
      - ./nginx/crl-server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - step-ca  # for CA certs

  # ---------------------------------------------------------------------------
  # Spring Boot backend (local dev — runs on host via mvn spring-boot:run)
  # Production deploys via Dockerfile in backend/. This compose stub is for
  # integration tests + the Phase 0 staging deploy verification.
  # ---------------------------------------------------------------------------
  # backend is intentionally NOT in compose for dev — developers run it on host
  # via `cd backend && SPRING_PROFILES_ACTIVE=local mvn spring-boot:run`
  # (per V3-DEVELOPER-SETUP §3).
  #
  # For CI/staging, GitHub Actions builds the Docker image from backend/Dockerfile
  # and pushes to ghcr.io/she-v3/she-backend:sha-<git-sha>.












