# =============================================================================
# SHE V3 — EMQX 5.x production reference config (cluster-override.conf)
# =============================================================================
# This is the canonical EMQX config snippet for production deployment on the
# Ethio Telecom Cloud (3 nodes: mqtt-1, mqtt-2, mqtt-3).
# V3-ARCHITECTURE §6, V3-MQTT-STANDARDS §9, V3-CONFIGURATION §2.2, V3-SECURITY-MODEL §3.4 + §4
#
# In Docker Compose (local dev) the equivalent config is provided via
# environment variables in docker-compose.yml — this .conf is the prod target.
# =============================================================================

# ---------------------------------------------------------------------------
# Cluster
# ---------------------------------------------------------------------------
node {
  name = "emqx@mqtt-1.she.internal"   # overridden per node: mqtt-2, mqtt-3
  cookie = "REPLACE_VIA_EMQX_NODE__COOKIE_ENV"   # shared secret, 32+ chars
  data_dir = "/var/lib/emqx/data"
}

cluster {
  discovery_strategy = dns
  dns {
    name = "mqtt-cluster.she.internal"   # A record returning all 3 node IPs
    type = a
  }
}

# ---------------------------------------------------------------------------
# mTLS listener (V3-SECURITY-MODEL §3.4) — port 1883 DISABLED in production
# ---------------------------------------------------------------------------
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 5000
  ssl_options {
    keyfile  = /etc/emqx/certs/server.key
    certfile = /etc/emqx/certs/server.crt
    cacertfile = /etc/emqx/certs/ca_bundle.pem   # root + BOTH intermediates during overlap
    verify   = verify_peer
    fail_if_no_peer_cert = true
    versions = [tlsv1.3, tlsv1.2]   # 1.3 preferred, 1.2 fallback for older ESP32 mbedTLS
    # Reject weak ciphers
    ciphers = "TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256"
  }
}

# Disable plain MQTT (port 1883) — devices MUST use 8883 with mTLS
listeners.tcp.default {
  enable = false
}

# WebSocket (Phase 1+ — for Flutter app fallback over WSS)
listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket {
    mqtt_path = "/mqtt"
  }
}

# Dashboard — bind to internal interface only
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
  default_username = "admin"
  default_password = "REPLACE_VIA_EMQX_DASHBOARD__DEFAULT_PASSWORD_ENV"
}

# ---------------------------------------------------------------------------
# HTTP auth backend → Spring Boot /internal/mqtt/auth (V3-SECURITY-MODEL §4.2)
# P1-11: cache TTL = 300s (NOT default 60s)
# ---------------------------------------------------------------------------
authentication = [
  {
    cache { ttl = 300s }
    mechanism = password_based
    backend = http
    method = post
    url = "https://she-backend.internal:8080/internal/mqtt/auth"
    headers {
      content-type = "application/json"
      # X-Internal-Token verifies the call comes from EMQX (not external)
      x-internal-token = "REPLACE_WITH_INTERNAL_MQTT_TOKEN"
    }
    body {
      clientid = "${clientid}"
      cn = "${peer_cert_cn}"
      fingerprint = "${peer_cert_fingerprint}"
    }
    # Treat HTTP 4xx/5xx from Spring Boot as "deny" (fail-closed)
    connect_timeout = 5s
    request_timeout = 10s
    pool_size = 32
    enable_pipelining = 100
    ssl { enable = false }   # internal traffic; in prod Spring Boot is mTLS-only via internal CA
  }
]

# ---------------------------------------------------------------------------
# Authorization (ACL) — V3-SECURITY-MODEL §4.3, V3-MQTT-STANDARDS §9.2
# P1-32: use HOCON `authorization { sources = [...] }` — NOT flattened env vars
# ---------------------------------------------------------------------------
authorization {
  no_match = deny       # default deny if no rule matches
  deny_action = disconnect   # disconnect client on deny (more aggressive than default `ignore`)
  sources = [
    {
      type = file
      enable = true
      rules = [
        # ---- Backend service (cert CN = "she-backend", shared sub) ----
        { permission = allow, action = subscribe, topic = "she/+/+/+/+/telemetry" }
        { permission = allow, action = subscribe, topic = "she/+/+/+/+/status" }
        { permission = allow, action = subscribe, topic = "she/+/+/+/+/params/local" }
        { permission = allow, action = subscribe, topic = "she/+/+/+/+/energy" }
        { permission = allow, action = subscribe, topic = "she/+/+/+/+/ota/status" }
        { permission = allow, action = subscribe, topic = "she/+/+/+/+/ota/progress" }
        { permission = allow, action = publish,   topic = "she/+/+/+/+/command" }
        { permission = allow, action = publish,   topic = "she/+/+/+/+/params/remote" }
        { permission = allow, action = publish,   topic = "she/+/+/+/+/ota/url" }

        # ---- Devices (cert CN = clientid = normalized MAC) ----
        { permission = allow, action = publish,   topic = "she/+/+/+/${clientid}/config" }
        { permission = allow, action = publish,   topic = "she/+/+/+/${clientid}/params/local" }
        { permission = allow, action = publish,   topic = "she/+/+/+/${clientid}/telemetry" }
        { permission = allow, action = publish,   topic = "she/+/+/+/${clientid}/status" }
        { permission = allow, action = publish,   topic = "she/+/+/+/${clientid}/energy" }
        { permission = allow, action = publish,   topic = "she/+/+/+/${clientid}/ota/status" }
        { permission = allow, action = publish,   topic = "she/+/+/+/${clientid}/ota/progress" }
        { permission = allow, action = subscribe, topic = "she/+/+/+/${clientid}/command" }
        { permission = allow, action = subscribe, topic = "she/+/+/+/${clientid}/params/remote" }
        { permission = allow, action = subscribe, topic = "she/+/+/+/${clientid}/ota/url" }

        # ---- EXPLICIT DENY (forbidden patterns per V3-MQTT-STANDARDS §9.3) ----
        # Devices cannot subscribe to other devices' topics
        { permission = deny,  action = subscribe, topic = "she/+/+/+/#" }
        { permission = deny,  action = subscribe, topic = "$SYS/#" }
        { permission = deny,  action = subscribe, topic = "#" }
      ]
    }
  ]
}

# ---------------------------------------------------------------------------
# Shared subscription — Spring Boot instances in $she-backend group
# V3-ARCHITECTURE §7.2
# ---------------------------------------------------------------------------
shared_subscription {
  strategy = round_robin   # distribute messages evenly across Spring Boot instances
  group_strategy = sticky  # same client always routes to same instance (in-order delivery)
}

# ---------------------------------------------------------------------------
# MQTT protocol limits
# V3-SECURITY-MODEL §4.5 (rate limits), V3-MQTT-STANDARDS §5 (QoS + retain)
# ---------------------------------------------------------------------------
mqtt {
  max_packet_size = 64KB        # devices send small JSON payloads
  max_clientid_len = 64
  max_topic_levels = 10
  max_qos_allowed = 2
  retain_available = true
  wildcard_available = true
  shared_subscription_available = true
}

# Per-client rate limits (V3-SECURITY-MODEL §4.5)
mqtt.max_publish_rate = 20      # msg/s per client
mqtt.max_subscribe_rate = 10    # topics/s per client

# ---------------------------------------------------------------------------
# LWT payload (V3-MQTT-STANDARDS §3.5, P1-13 — JSON, not plain string)
# Spring Boot parses {"status":"offline"} JSON when LWT fires.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Prometheus metrics exporter (port 8888)
# V3-ARCHITECTURE §13 (observability)
# ---------------------------------------------------------------------------
prometheus {
  push_gateway = ""
  interval = 15000ms
}

listeners.prometheus.default {
  bind = "0.0.0.0:8888"
}

# ---------------------------------------------------------------------------
# Logging — structured JSON to stdout (collected by Loki)
# ---------------------------------------------------------------------------
log {
  console {
    enable = true
    level = warning
    formatter = json
  }
  file {
    enable = false
  }
}
