# =============================================================================
# SHE V3 — Spring Boot application config (shared across profiles)
# =============================================================================
# Profile-specific overrides live in application-{local,staging,prod}.yml.
# All secrets come from environment variables (NEVER inline).
# Canonical reference: V3-CONFIGURATION.md §2.1
# =============================================================================

spring:
  application:
    name: she-backend

  # ---- Flyway (V3-DATABASE-DESIGN §1, V3-OPS-RUNBOOK §2.3) ----
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false        # strict — clean DB only
    validate-on-migrate: true         # refuse if checksums don't match
    out-of-order: false               # forward-only per V3-DEVELOPER-SETUP §4.1
    table: flyway_schema_history
    user: ${SPRING_DATASOURCE_MIGRATION_USERNAME:she_migrate}
    password: ${SPRING_DATASOURCE_MIGRATION_PASSWORD:ChangeMeLocal}
    schemas: public

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate              # NEVER `update` in prod; Flyway owns schema
    open-in-view: false               # V3-ARCHITECTURE §5.1 — no lazy loading in controllers
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_schema: public
        format_sql: false

  # ---- Datasource (HikariCP, V3-ARCHITECTURE §5.1 — 20 conn per instance) ----
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/she_v3}
    username: ${SPRING_DATASOURCE_USERNAME:she_app}
    password: ${SPRING_DATASOURCE_PASSWORD:ChangeMeLocal}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000        # 5s
      idle-timeout: 600000            # 10 min
      max-lifetime: 1800000           # 30 min
      leak-detection-threshold: 30000 # 30s — log if a connection is held > 30s
      connection-init-sql: "SET TIME ZONE 'UTC'"
      pool-name: she-hikari-pool

  # ---- Redis (V3-ARCHITECTURE §5.4) ----
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:ChangeMeLocal}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s

  # ---- Jackson ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

# =============================================================================
# Server (Tomcat)
# =============================================================================
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful                  # graceful drain on SIGTERM
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 10s
    max-connections: 8192
    accesslog:
      enabled: true
      pattern: '%t %a "%r" %s %b %{X-Request-Id}i %D'
      directory: /var/log/she
      prefix: access_log
      suffix: .log
      rotate: true

# =============================================================================
# Management / Actuator (V3-OPS-RUNBOOK §3.3)
# =============================================================================
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}    # separate from main 8080
    address: 0.0.0.0
  endpoints:
    enabled-by-default: false
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,loggers,metrics
  endpoint:
    health:
      enabled: true
      show-details: when_authorized
      show-components: always
      probes:
        enabled: true                   # k8s-style liveness/readiness probes
    info:
      enabled: true
    prometheus:
      enabled: true
    loggers:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true
  info:
    env:
      enabled: false                    # do not leak env vars
    git:
      mode: full
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:unknown}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jdbc.query: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

# =============================================================================
# SHE-specific configuration (bound to @ConfigurationProperties)
# =============================================================================
she:
  jwt:
    signing-private-key-path: ${JWT_SIGNING_PRIVATE_KEY_PATH}
    signing-key-id: ${JWT_SIGNING_KEY_ID}
    # JSON array of {kid, public_key_pem} entries — accepts all listed keys (P1-6 rotation window)
    signing-public-keys-json: ${JWT_SIGNING_PUBLIC_KEYS}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds:
      USER: ${JWT_REFRESH_TOKEN_TTL_SECONDS_USER:2592000}
      TENANT_ADMIN: ${JWT_REFRESH_TOKEN_TTL_SECONDS_TENANT_ADMIN:28800}
      PLATFORM_ADMIN: ${JWT_REFRESH_TOKEN_TTL_SECONDS_PLATFORM_ADMIN:28800}
      SUPER_ADMIN: ${JWT_REFRESH_TOKEN_TTL_SECONDS_SUPER_ADMIN:14400}
    issuer: she.et
    audience: she-api

  security:
    bcrypt-cost: ${BCRYPT_COST:12}
    kek: ${KEK}                         # AES-256-GCM master key (base64)
    mfa-issuer: ${MFA_ISSUER_NAME:SmartHomeEthiopia}
    login-rate-limit:
      max-attempts: 5
      window-minutes: 15
      lockout-minutes: 60

  mqtt:
    broker-url: ${MQTT_BROKER_URL:ssl://localhost:8883}
    backend-cert-path: ${MQTT_BACKEND_CERT:/etc/she/certs/she-backend.crt}
    backend-key-path: ${MQTT_BACKEND_KEY:/etc/she/certs/she-backend.key}
    ca-bundle-path: ${MQTT_CA_BUNDLE:/etc/she/ca/ca_bundle.pem}
    shared-subscription-group: ${MQTT_SHARED_SUBSCRIPTION_GROUP:she-backend}
    client-id-prefix: ${MQTT_CLIENT_ID_PREFIX:she-backend}
    # Internal token verifying that /internal/mqtt/* calls come from EMQX, not external
    internal-token: ${EMQX_INTERNAL_TOKEN:dev-internal-token-not-for-prod}

  ca:
    url: ${STEP_CA_CLIENT_URL:http://step-ca:9000}
    provisioner-name: ${STEP_CA_CLIENT_PROVISIONER_NAME:she-device-provisioner}
    provisioner-password-file: ${STEP_CA_CLIENT_PROVISIONER_PASSWORD_FILE:/provisioner-password.txt}
    # Provisioner JWK (encrypted at rest) — required to mint the one-time token
    # that step-ca's /sign endpoint demands for JWK provisioners.
    provisioner-key-path: ${STEP_CA_PROVISIONER_KEY_PATH:}
    intermediate-cert-path: ${CA_INTERMEDIATE_CERT_PATH:/etc/she/ca/intermediate.crt}
    ca-bundle-path: ${CA_BUNDLE_PATH:/etc/she/ca/ca_bundle.pem}
    crl-publish-base-url: ${CRL_PUBLISH_BASE_URL:http://localhost:8088/ca}
    # Cache TTL for active device cert lookups (5 min — bounds cert revocation delay)
    cert-cache-ttl-seconds: 300

  api:
    base-path: /api/v3
    pagination:
      default-page-size: 20
      max-page-size: 100
    rate-limit:
      per-user-per-minute: 600
      per-tenant-per-minute: 6000

  ota:
    # How long an approval may sit with no ota/status from its device before the sweep
    # gives up and fails it. Deliberately generous: a device that is simply offline for a
    # few hours should not have a rollout that is still going to succeed marked failed.
    # Env-tunable so a sweep can be exercised without waiting (e.g. =1 for a test).
    stale-rollout-minutes: ${SHE_OTA_STALE_ROLLOUT_MINUTES:360}

  # ---- Payment (Chapa — Telebirr/CBE Birr aggregator) ----
  # V3-PAYMENTS §3, ADR-005. Secrets stay empty until a Chapa sandbox account
  # exists; PaymentService must still start without them.
  payment:
    chapa:
      api-base-url: ${CHAPA_API_BASE_URL:https://api.chapa.co/v1}
      secret-key: ${CHAPA_SECRET_KEY:}
      webhook-secret: ${CHAPA_WEBHOOK_SECRET:}
      callback-url: ${CHAPA_CALLBACK_URL:http://localhost:8080/api/v3/payments/webhook}
      return-url: ${CHAPA_RETURN_URL:she-app://payments/success}
      ip-whitelist: ${CHAPA_WEBHOOK_IP_WHITELIST:41.216.199.0/24,196.188.124.0/24}

# =============================================================================
# Logging (V3-OPS-RUNBOOK §3.3 — structured for Loki)
# =============================================================================
logging:
  level:
    root: INFO
    et.she: ${SHE_LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.zaxxer.hikari: INFO
  pattern:
    console: '{"time":"%d","level":"%p","logger":"%c","thread":"%t","msg":"%m","reqId":"%X{reqId}"}%n'

# =============================================================================
# OpenAPI / Swagger (V3-DEVELOPER-SETUP §3)
# =============================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
